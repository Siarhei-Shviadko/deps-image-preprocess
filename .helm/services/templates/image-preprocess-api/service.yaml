apiVersion: v1
kind: Service
metadata:
  name: image-preprocess
  labels:
    {{- include "image-preprocess.labels" . | nindent 4 }}
spec:
  type: {{ .Values.image_preprocess.service.type }}
  ports:
    - port: {{ .Values.image_preprocess.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "image-preprocess.selectorLabels" . | nindent 4 }}
