apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-preprocess-consumer
  labels:
    {{- include "image-preprocess.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.image_preprocess_consumer.replicaCount }}
  selector:
    matchLabels:
      {{- include "image-preprocess.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "image-preprocess.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.image_preprocess_consumer.imagePullSecrets }}
      imagePullSecrets:
        - name: {{ .Values.image_preprocess_consumer.imagePullSecrets }}
      {{- end }}
      {{- if .Values.podSecurityContext.runAsNonRoot }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if or .Values.vault_settings.hashicorp_vault .Values.vault_settings.gcp_secret_manager .Values.vault_settings.aws_secret_manager }}
      serviceAccountName: {{ .Values.service_account.serviceAccountName }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: '{{ .Values.registry }}{{ .Values.image_preprocess_consumer.image.path }}:{{ .Values.image_preprocess_consumer.image.tag | default "latest" }}'
          imagePullPolicy: {{ .Values.image_preprocess_consumer.image.pullPolicy }}
          command: ["python", "-m", "deps_image_preprocess", "dispatch"]
          env:
          {{ if .Values.image_preprocess_settings.INSTRUMENTATION_ENABLED }}
          {{ if eq .Values.image_preprocess_settings.EXPORTER_TYPE "azure" }}
          - name: APPLICATION_INSIGHTS_CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: {{ .Values.secrets.telemetry_secrets.secretName }}
                key: application-insights-connection-string
          {{ end }}
          {{ end }}   
          {{- if .Values.vault_settings.enabled }}
          {{- toYaml .Values.vault_enabled_consumer.env | nindent 10 }}
          {{ if .Values.image_preprocess_settings.RABBITMQ_TLS_ENABLED }}
          - name: RABBITMQ_TLS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deps-image-preprocess
                key: rabbitmq-password
          {{ end }}
          {{ if .Values.image_preprocess_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: deps-image-preprocess
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: deps-image-preprocess
                key: kafka-sasl-password
          {{ end }}
          {{ else }}
          {{- toYaml .Values.vault_disabled_consumer.env | nindent 10 }}
          {{ if .Values.image_preprocess_settings.RABBITMQ_TLS_ENABLED }}
          - name: RABBITMQ_TLS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rabbitmq-password
                key: rabbitmq-password
          {{ end }}
          {{ if .Values.image_preprocess_settings.KAFKA_SECURITY_ENABLED }}
          - name: KAFKA_SASL_USERNAME
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-username
          - name: KAFKA_SASL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kafka-secrets
                key: kafka-sasl-password
          {{ end }}       
          {{- end }}
          readinessProbe:
            exec:
              command:
                - "bash"
                - "-c"
                - |
                  if [ "$MESSAGING_DRIVER" == "rabbitmq" ]; then
                    echo > /dev/tcp/$MESSAGING_DRIVER/5672 && echo "RabbitMQ connected" || { echo "RabbitMQ not connected"; exit 1; }
                  fi

                  if [ "$MESSAGING_DRIVER" == "kafka" ]; then
                    echo > /dev/tcp/$(echo "$MESSAGE_BROKER_CONNECTION_STRING" | cut -d':' -f1)/$(echo "$MESSAGE_BROKER_CONNECTION_STRING" | cut -d':' -f2) && echo "Kafka connected" || { echo "Kafka not connected"; exit 1; }
                  fi
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 14
          volumeMounts:
          {{ if .Values.image_preprocess_settings.RABBITMQ_TLS_ENABLED }}
          - name: security-certs
            mountPath: {{ .Values.certs_location.certs_default_path }}
            readOnly: true
          {{ end }}
          {{- if .Values.vault_settings.enabled }}
          - name: secrets-store-inline
            mountPath: {{ .Values.secrets_location.secrets_default_path }}
            readOnly: true
          {{- end }}
          envFrom:
          - configMapRef:
              name: image-preprocess-configmap
              optional: false
          resources:
            {{- toYaml .Values.image_preprocess_consumer.resources | nindent 12 }}
      volumes:
      {{ if .Values.image_preprocess_settings.RABBITMQ_TLS_ENABLED }}
      - name: security-certs
        secret:
          secretName: {{ .Values.secrets.security_certs.secretName }}
      {{ end }}
      {{- if .Values.vault_settings.enabled }}
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: {{ .Values.csi.csi_default_name }}
      {{- end }}
      {{- with .Values.image_preprocess_consumer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image_preprocess_consumer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image_preprocess_consumer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
