[tool.poetry]
name = "image-preprocess"
version = "0.1.0"
description = "Service for image preprocessing (rotation, orientation, etc.)"
authors = []

[tool.poetry.dependencies]
python = "~3.9"
pydantic = "^2.0"
pydantic-settings = "^2.0"
click = "^8.1.3"
fastapi = "^0.120"
dependency-injector = "~4.36.0"
uvicorn = "^0.18.3"
python-multipart = "^0.0.18"
numpy = "1.24.4"
opencv-python-headless = "4.9.0.80"
scipy = "1.12.0"
tesserocr = "2.6.1"
pypdfium2 = "^2.11.0"
Pillow = "~10.3.0"
h11 = "^0.16.0"

deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq", "deps-integrations"], develop = true }
deps-observability-instrumentation = { path = "../vendors/deps-observability-instrumentation", develop = true }

[tool.poetry.dev-dependencies]
mypy = "^1.5.1"
bandit = "^1.7.5"
flake8 = "^6.1.0"
wemake-python-styleguide = "^0.18"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
requests-mock = "~1.9.3"
types-requests = "^2.25.6"
httpx = "^0.27.0"
flake8-commas-x = "^3.0.0"

ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.poetry.extras]
datasource = ["datasource"]

[tool.black]
line-length = 130
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''
